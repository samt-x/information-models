name: Lint og valider LinkML

on:
  pull_request:
    branches: [main]
    paths:
      - 'linkml/**'
      - '.linkmllint.yaml'
      - '.github/workflows/validate-linkml.yml'
  push:
    branches: [main]
    paths:
      - 'linkml/**'
      - '.linkmllint.yaml'
      - '.github/workflows/validate-linkml.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Lint og valider skjemaene
        shell: bash
        env:
          LINKML_IMAGE: linkml/linkml:1.12.1@sha256:37859c05b9ba1242be63f61d599edf4ba3a312d2d1893c067aefb191311b59c8
        run: |
          docker pull "$LINKML_IMAGE"
          status=0
          
          docker run --pull=never --rm -v "$PWD:/work:ro" -w /work "$LINKML_IMAGE" \
            linkml lint --format markdown linkml/ | tee "$GITHUB_STEP_SUMMARY" || status=$?
          
          if [[ ! -s "$GITHUB_STEP_SUMMARY" ]]; then
            echo 'LinkML kunne ikke lage rapporten. Se feilmeldingen i kjøreloggen.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$status"
