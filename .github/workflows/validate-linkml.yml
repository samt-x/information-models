name: Valider LinkML

on:
  pull_request:
    branches: [main]
    paths:
      - 'linkml/**'
      - '.github/workflows/validate-linkml.yml'
  push:
    branches: [main]
    paths:
      - 'linkml/**'
      - '.github/workflows/validate-linkml.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Valider skjemaene mot LinkML-metamodellen
        shell: bash
        env:
          LINKML_IMAGE: linkml/linkml:1.12.1@sha256:37859c05b9ba1242be63f61d599edf4ba3a312d2d1893c067aefb191311b59c8
        run: |
          shopt -s globstar nullglob
          schemas=(linkml/**/*.{yaml,yml})
          printf '## LinkML-validering (%d skjemaer)\n\n' "${#schemas[@]}" >> "$GITHUB_STEP_SUMMARY"
          if (( ${#schemas[@]} )); then
            printf -- '- `%s`\n' "${schemas[@]}" >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          docker run --rm -v "$PWD/linkml:/work/linkml:ro" -w /work "$LINKML_IMAGE" \
            linkml validate "${schemas[@]}" 2>&1 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
